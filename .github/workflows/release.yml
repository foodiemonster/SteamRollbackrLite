name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            sed -i "s/^version = .*/version = \"${VER}\"/" Cargo.toml
          else
            VER="0.1.5"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Build tarball
        run: |
          mkdir -p dist/pkg
          cp target/release/steamrollbackr-lite dist/pkg/
          cp packaging/steamrollbackr-lite.desktop dist/pkg/
          cp packaging/steamrollbackr-lite.png dist/pkg/
          cp install.sh dist/pkg/
          cp README.md dist/pkg/
          tar -czf dist/steamrollbackr-lite-linux-x86_64.tar.gz -C dist/pkg .
          rm -rf dist/pkg

      - name: Build .deb package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DEB_DIR="dist/deb_pkg"
          mkdir -p "$DEB_DIR/DEBIAN" \
                   "$DEB_DIR/usr/bin" \
                   "$DEB_DIR/usr/share/applications" \
                   "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          install -Dm755 target/release/steamrollbackr-lite "$DEB_DIR/usr/bin/steamrollbackr-lite"
          install -Dm644 packaging/steamrollbackr-lite.desktop "$DEB_DIR/usr/share/applications/steamrollbackr-lite.desktop"
          install -Dm644 packaging/steamrollbackr-lite.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/steamrollbackr-lite.png"
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: steamrollbackr-lite
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: foodiemonster
          Description: Cross-distro Linux GUI utility to roll back the Steam client and lock/unlock updates
          EOF
          dpkg-deb --build "$DEB_DIR" "dist/steamrollbackr-lite_${VER}_amd64.deb"
          rm -rf "$DEB_DIR"

      - name: Build .rpm package
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          VER="${{ steps.ver.outputs.version }}"
          RPM_TOP="$(pwd)/dist/rpmbuild"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS,BUILDROOT}
          cat > "$RPM_TOP/SPECS/steamrollbackr-lite.spec" <<EOF
          Name:           steamrollbackr-lite
          Version:        $VER
          Release:        1
          Summary:        Roll back the Steam Linux client and lock/unlock updates
          License:        MIT
          BuildArch:      x86_64
          AutoReqProv:    no

          %description
          Cross-distro Linux GUI utility to roll back the Steam client and lock/unlock updates.

          %install
          install -Dm755 $(pwd)/target/release/steamrollbackr-lite %{buildroot}/usr/bin/steamrollbackr-lite
          install -Dm644 $(pwd)/packaging/steamrollbackr-lite.desktop %{buildroot}/usr/share/applications/steamrollbackr-lite.desktop
          install -Dm644 $(pwd)/packaging/steamrollbackr-lite.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/steamrollbackr-lite.png

          %files
          /usr/bin/steamrollbackr-lite
          /usr/share/applications/steamrollbackr-lite.desktop
          /usr/share/icons/hicolor/256x256/apps/steamrollbackr-lite.png
          EOF
          rpmbuild --define "_topdir $RPM_TOP" -bb "$RPM_TOP/SPECS/steamrollbackr-lite.spec"
          cp "$RPM_TOP/RPMS/x86_64/steamrollbackr-lite-${VER}-1.x86_64.rpm" dist/
          rm -rf "$RPM_TOP"

      - name: Build .AppImage
        run: |
          VER="${{ steps.ver.outputs.version }}"
          APP_DIR="dist/AppDir"
          mkdir -p "$APP_DIR/usr/bin"
          install -Dm755 target/release/steamrollbackr-lite "$APP_DIR/usr/bin/steamrollbackr-lite"
          install -Dm644 packaging/steamrollbackr-lite.desktop "$APP_DIR/steamrollbackr-lite.desktop"
          install -Dm644 packaging/steamrollbackr-lite.png "$APP_DIR/steamrollbackr-lite.png"
          ln -sf steamrollbackr-lite.png "$APP_DIR/.DirIcon"
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/steamrollbackr-lite" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"

          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o dist/appimagetool
          chmod +x dist/appimagetool
          ARCH=x86_64 dist/appimagetool --appimage-extract-and-run "$APP_DIR" "dist/SteamRollbackrLite-${VER}-x86_64.AppImage"
          rm -rf "$APP_DIR" dist/appimagetool

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steamrollbackr-lite-linux-x86_64.tar.gz
            dist/steamrollbackr-lite_*.deb
            dist/steamrollbackr-lite-*.rpm
            dist/SteamRollbackrLite-*-x86_64.AppImage
          generate_release_notes: true
