app-id: io.github.foodiemonster.SteamRollbackrLite
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: steamrollbackr-lite
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: steamrollbackr-lite
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/steamrollbackr-lite/cargo
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/steamrollbackr-lite /app/bin/steamrollbackr-lite
      - install -Dm644 packaging/steamrollbackr-lite.png /app/share/icons/hicolor/256x256/apps/steamrollbackr-lite.png
      - install -Dm644 packaging/steamrollbackr-lite.desktop /app/share/applications/io.github.foodiemonster.SteamRollbackrLite.desktop
    sources:
      - type: dir
        path: ../..

